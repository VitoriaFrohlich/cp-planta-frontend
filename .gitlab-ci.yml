stages:
  - pre-commit-check
  - commit-msg-check
  - lint
  - test

# Job para simular o pre-commit
pre-commit-check:
  stage: pre-commit-check
  image: node:18 
  before_script:
    - npm ci  # Instala as dependências
  script:
    - ./ci/pre-commit-check.sh  # Executa o script de pre-commit
  only:
    - merge_requests
    - branches

# Job para simular o commit-msg
commit-msg-check:
  stage: commit-msg-check
  image: node:18  
  before_script:
    - npm ci  # Instala as dependências
  script:
    - ./ci/commit-msg-check.sh "$CI_COMMIT_MESSAGE"  # Passa a mensagem de commit para validação
  only:
    - merge_requests
    - branches

# Job para verificar o lint
lint:
  stage: lint
  image: node:18  
  before_script:
    - npm ci  # Instala as dependências
  script:
    - npm run lint  # Comando para verificar o lint, ajuste conforme necessário
  only:
    - merge_requests
    - branches

# Job para executar os testes
test:
  stage: test
  image: node:18  
  before_script:
    - npm ci  # Instala as dependências
  script:
    - npm run test  # Comando para executar os testes, ajuste conforme necessário
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest  # Use Docker image for building
  services:
    - docker:dind  # Docker in Docker service
  before_script:
    - docker info  # Ensure Docker is running
  script:
    - docker build -f Dockerfile -t $DOCKER_IMAGE_FRONTEND .
  only:
    - main
privileged: true

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest  # Use Docker image for pushing
  services:
    - docker:dind  # Docker in Docker service
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
    - docker push $DOCKER_IMAGE_FRONTEND
  only:
    - main
  dependencies:
    - build-frontend