stages:
  - pre-commit-check
  - commit-msg-check
  - lint
  - test
  - build
  - push

cache:
  paths:
    - node_modules/

# Default settings for all jobs
default:
  image: node:22.5.0
  before_script:
    - rm -rf node_modules/ # Remove node_modules directory
    - npm install --force # Install dependencies cleanly

# Job for simulating the commit-msg check
commit-msg-check:
  stage: commit-msg-check
  image: node:18  
  before_script:
    - npm ci  # Instala as dependências
  script:
    - bash ci/commit-msg-check.sh "$CI_COMMIT_MESSAGE"
  only:
    - merge_requests
    - branches

# Job for checking the lint
lint:
  stage: lint
  before_script:
    - npm install -g eslint@8.x.x prettier@3.x.x
  script:
    - npm run lint
    - npm run prettier
  only:
    - branches

# Job para executar os testes
test:
  stage: test
  before_script:
    - npm install -g jest@27.x.x
  script:
    - npm run test  
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Skipping npm install for Docker build"
    - docker info
  script:
    - docker build -f Dockerfile -t $DOCKER_IMAGE_FRONTEND .
  only:
    - main

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Skipping npm install for Docker push"
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - docker push $DOCKER_IMAGE_FRONTEND
  only:
    - main