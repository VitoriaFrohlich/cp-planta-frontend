stages:
  - pre-commit-check
  - commit-msg-check
  - lint
  - test
  - build
  - push

variables:
  DOCKER_IMAGE_FRONTEND: norohim/cp-planta-frontend:latest

# Default settings for all jobs
default:
  image: node:22.5.0
  before_script:
    - rm -rf node_modules  # Remove node_modules before installation to avoid conflicts
    - npm install  # Install dependencies fresh in every job

# Job for simulating the commit-msg check
commit-msg-check:
  stage: commit-msg-check
  script:
    - bash ci/commit-msg-check.sh "$CI_COMMIT_MESSAGE"
  only:
    - merge_requests
    - branches

# Job for checking the lint
lint:
  stage: lint
  script:
    - npm run linters
  only:
    - branches

# Job for running the tests
test:
  stage: test
  script:
    - npm run test  
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Skipping npm install for Docker build"
    - docker info
  script:
    - docker build -f Dockerfile -t $DOCKER_IMAGE_FRONTEND .
  only:
    - main

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Skipping npm install for Docker push"
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - docker push $DOCKER_IMAGE_FRONTEND
  only:
    - main
  dependencies:
    - build-frontend