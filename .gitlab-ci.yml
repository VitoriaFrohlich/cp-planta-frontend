variables:
  # Docker image details
  DOCKER_IMAGE_NAME: norohim/cp-planta-frontend
  DOCKER_IMAGE_TAG: latest
  DOCKER_DRIVER: overlay2

stages:
  - commit-msg-check
  - lint
  - test
  - build
  - push

cache:
  paths:
    - node_modules/

# Default settings for all jobs
default:
  image: node:22.5.0
  before_script:
    - rm -rf node_modules/ # Remove node_modules directory
    - npm install --force # Install dependencies cleanly

# Commit message check using commitlint
commit-msg-check:
  stage: commit-msg-check
  script:
    - echo "$CI_COMMIT_MESSAGE" | npx commitlint
  only:
    - merge_requests
    - branches

# Linting and formatting job
lint:
  stage: lint
  before_script:
    - npm install -g eslint@8.x.x prettier@3.x.x
  script:
    - npm run lint
    - npm run prettier
  only:
    - merge_requests
    - branches

# Testing job
test:
  stage: test
  before_script:
    - npm install -g jest@29.x.x
  script:
    - npm run test:ci
  only:
    - merge_requests
    - branches

# Build Docker image job
build_docker_image:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - docker build -f Dockerfile -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker save "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  only:
   - master

# Push Docker image job
push_docker_image:
  stage: push
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker load -i image.tar
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  dependencies:
    - build_docker_image
  only:
    - master