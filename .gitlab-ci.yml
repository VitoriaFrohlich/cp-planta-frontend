# Definir a imagem base com Node.js
image: node:18

# Variáveis globais
variables:
  NODE_ENV: test

# Cache para dependências (npm ou yarn)
cache:
  paths:
    - node_modules/

stages:
  - install
  - lint
  - test

# Etapa de Instalação de Dependências
install_dependencies:
  stage: install
  script:
    - npm install # Substitua por 'yarn install' se estiver usando yarn
  artifacts:
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Etapa de Lint (Verificação de Código)
lint:
  stage: lint
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # Execute apenas em MRs
  allow_failure: true # Não falhar se o lint não passar (opcional)

# Etapa de Testes
test:
  stage: test
  script:
    - npm run test
  artifacts:
    when: always
    reports:
      junit: report.xml # Gerar relatório de testes
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
