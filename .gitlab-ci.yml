variables:
  # Docker image details
  DOCKER_IMAGE_NAME: norohim/cp-planta-frontend
  DOCKER_IMAGE_TAG: latest
  DOCKER_DRIVER: overlay2

stages:
  - commit-msg-check
  - lint
  - test
  - build_and_push
  - deploy

# Default settings for all jobs
default:
  image: node:22.5.0
  before_script:
    - npm cache clean --force
    - rm -rf node_modules/ package-lock.json # Remove node_modules directory
    - npm install --force --ignore-scripts # Install dependencies cleanly
    - df -h

# Commit message check using commitlint
commit-msg-check:
  image: node:22.5.0
  stage: commit-msg-check
  script:
    - echo "$CI_COMMIT_MESSAGE" | npx commitlint
  only:
    - merge_requests
    - branches

# Job for checking the lint
lint:
  image: node:22.5.0
  stage: lint
  before_script:
    - npm cache clean --force
    - rm -rf node_modules/ package-lock.json # Remove node_modules directory
    - npm install --force --ignore-scripts # Install dependencies cleanly
    - npm install -g eslint@8.x.x prettier@3.x.x
    - df -h
  script:
    - npm run lint
    - npm run prettier
  only:
    - merge_requests
    - branches

# Testing job
test:
  stage: test
  before_script:
    - npm cache clean --force
    - rm -rf node_modules/ package-lock.json # Remove node_modules directory
    - npm install --force --ignore-scripts # Install dependencies cleanly
    - npm install -g jest@29.x.x
    - df -h
  script:
    - npm run test:ci  # Command to run tests
  only:
    - merge_requests
    - branches

# Build and Push Docker image job
build_and_push_docker_image:
  stage: build_and_push
  image: docker:latest # Use Docker image for building
  services:
    - docker:dind 
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -f Dockerfile -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  only:
    - master   

# trigger deploy when build an push succeed
trigger-infra-pipeline:
  stage: deploy
  before_script:
    - apt-get install -y curl bash 
  script:
    - echo "Triggering infrastructure pipeline..."
    - curl -X POST --fail -F token=90cbad47a562a7bae7cf8de55d3e34 -F ref=main https://tools.ages.pucrs.br/api/v4/projects/683/trigger/pipeline
  only:
    - master
  dependencies:
    - build_and_push_docker_image
