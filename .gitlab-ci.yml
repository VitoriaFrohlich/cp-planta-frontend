stages:
  - pre-commit-check
  - commit-msg-check
  - lint
  - test
  - build
  - push

variables:
  DOCKER_IMAGE_FRONTEND: norohim/cp-planta-frontend:latest

# Default settings for all jobs
default:
  image: node:22.5.0  # Using Node.js 22.5.0 image for Node-related tasks
  before_script:
    - npm install  # Install dependencies using npm
    - eslint --init

# Job para simular o pre-commit
pre-commit-check:
  stage: pre-commit-check
  image: node:18 
  before_script:
    - npm ci  # Instala as dependências
  script:
    - npm i eslint
    - eslint --init
    - bash ci/pre-commit-check.sh  # Executes the pre-commit script
  only:
    - merge_requests
    - branches

# Job para simular o commit-msg
commit-msg-check:
  stage: commit-msg-check
  image: node:18  
  before_script:
    - npm ci  # Instala as dependências
  script:
    - ./ci/commit-msg-check.sh "$CI_COMMIT_MESSAGE"  # Passa a mensagem de commit para validação
  only:
    - merge_requests
    - branches

# Job for checking the lint
lint:
  stage: lint
  script:
    - npm i eslint
    - eslint --init
    - npm run linters  # Command to check lint
  only:
    - merge_requests
    - branches

# Job para executar os testes
test:
  stage: test
  image: node:18  
  before_script:
    - npm ci  # Instala as dependências
  script:
    - npm i jest
    - npm run test  # Command to run tests
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest  # Use Docker image for building
  services:
    - docker:dind  # Docker in Docker service
  before_script:
    - docker info  # Ensure Docker is running
  script:
    - docker build -f Dockerfile -t $DOCKER_IMAGE_FRONTEND .
  only:
    - main

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest  # Use Docker image for pushing
  services:
    - docker:dind  # Docker in Docker service
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - docker push $DOCKER_IMAGE_FRONTEND
  only:
    - main
  dependencies:
    - build-frontend