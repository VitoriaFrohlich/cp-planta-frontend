stages:
  - pre-commit-check
  - commit-msg-check
  - lint
  - test
  - build
  - push

variables:
  DOCKER_IMAGE_FRONTEND: norohim/cp-planta-frontend:latest

# Default settings for all jobs
default:
  image: node:22.5.0  # Using Node.js 22.5.0 image
  services:
    - docker:dind  # Enabling Docker in Docker (DinD) for running Docker containers
  before_script:
    - npm install  # Using npm ci for faster and clean installs

# Job for simulating the pre-commit check
pre-commit-check:
  stage: pre-commit-check
  script:
    - bash ci/pre-commit-check.sh  # Executes the pre-commit script
  only:
    - merge_requests
    - branches

# Job for simulating the commit-msg check
commit-msg-check:
  stage: commit-msg-check
  script:
    - bash ci/commit-msg-check.sh "$CI_COMMIT_MESSAGE"  # Passes the commit message for validation
  only:
    - merge_requests
    - branches

# Job for checking the lint
lint:
  stage: lint
  script:
    - npm run lint  # Command to check lint
  only:
    - merge_requests
    - branches

# Job for running the tests
test:
  stage: test
  script:
    - npm run test  # Command to run tests
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest  # Docker image for building
  services:
    - name: docker:dind  # Enabling Docker in Docker (DinD) service
      privileged: true  # Privileged mode for Docker in Docker is allowed here at the job level
  script:
    - docker build -f Dockerfile -t $DOCKER_IMAGE_FRONTEND .
  only:
    - main

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest  # Docker image for pushing
  services:
    - name: docker:dind
      privileged: true  # Privileged mode allowed at the job level
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
    - docker push $DOCKER_IMAGE_FRONTEND
  only:
    - main
  dependencies:
    - build-frontend
