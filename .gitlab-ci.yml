stages:
  - pre-commit-check
  - commit-msg-check
  - lint
  - test
  - build
  - push

variables:
  DOCKER_IMAGE_FRONTEND: norohim/cp-planta-frontend:latest

# Default settings for all jobs
default:
  image: node:22.5.0
  before_script:
    - npm install  
  cache:
    key: ${CI_COMMIT_REF_SLUG}  # Cache per branch (or other identifier)
    paths:
      - node_modules/  # Cache the installed node_modules folder

# Job for simulating the pre-commit check
pre-commit-check:
  stage: pre-commit-check
  script:
    - bash ci/pre-commit-check.sh  # Executes the pre-commit script
  only:
    - merge_requests
    - branches

# Job for simulating the commit-msg check
commit-msg-check:
  stage: commit-msg-check
  script:
    - bash ci/commit-msg-check.sh "$CI_COMMIT_MESSAGE"  # Passes the commit message for validation
  only:
    - merge_requests
    - branches

# Job for checking the lint
lint:
  stage: lint
  script:
    - npm run lint  # Assumes the lint script is defined in package.json
  only:
    - merge_requests
    - branches

# Job for running the tests
test:
  stage: test
  script:
    - npm run test  # Command to run tests (ensure the test script is defined in package.json)
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - docker build -f Dockerfile -t $DOCKER_IMAGE_FRONTEND .
  only:
    - main

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - docker push $DOCKER_IMAGE_FRONTEND
  only:
    - main
  dependencies:
    - build-frontend