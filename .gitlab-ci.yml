variables:
  # Docker image details
  DOCKER_IMAGE_NAME: norohim/cp-planta-frontend
  DOCKER_IMAGE_TAG: latest
  DOCKER_DRIVER: overlay2

stages:
  - commit-msg-check
  - lint
  - test
  - build
  - push

cache:
  paths:
    - node_modules/

# Default settings for all jobs
default:
  image: node:22.5.0
  before_script:
    - npm cache clean --force
    - rm -rf node_modules/ # Remove node_modules directory
    - npm install --force # Install dependencies cleanly

# Commit message check using commitlint
commit-msg-check:
  stage: commit-msg-check
  script:
    - echo "$CI_COMMIT_MESSAGE" | npx commitlint
  only:
    - merge_requests
    - branches


# Job for checking the lint
lint:
  stage: lint
  before_script:
    - npm install -g eslint@8.x.x prettier@3.x.x
  script:
    - npm run lint
    - npm run prettier
  only:
    - branches

# Testing job
test:
  stage: test
  before_script:
    - npm install -g jest@29.x.x
  script:
    - npm run test:ci  # Command to run tests (ensure the test script is defined in package.json)
  only:
    - merge_requests
    - branches

# Job to build the Docker image for the frontend
build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Skipping npm install for Docker build"
    - docker info
  script:
    - docker build -f Dockerfile -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker save "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  only:
   - master

# Job to push the Docker image for the frontend
push-frontend:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - docker load -i image.tar
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  dependencies:
    - build_docker_image
  only:
    - master